<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LUMA-1</title>
<style>body{background:#000;color:#0f0;text-align:center;padding:30px;font-family:monospace}.box{border:1px solid #0f0;padding:20px;border-radius:12px;max-width:400px;margin:auto}#c{color:#fff;font-size:22px}#s{font-size:12px}</style>
</head>
<body>
<h1>LUMA-1 DAWI KAWN</h1>
<div class="box">
<p>BEACON DAWI DABA<br>33.0772N 7.6233W</p>
<p>LIVE • <span id="c">...</span> DAWI<br><span id="s">كيحاول...</span></p>
</div>
<script>
let local=parseInt(localStorage.getItem('luma')||'128');
function show(n,m){
 document.getElementById('c').textContent=n;
 document.getElementById('s').textContent=m;
}
show(local,'OFFLINE');
fetch('https://api.countapi.xyz/hit/luma1-dawi-global-v3/visits')
.then(r=>r.json())
.then(d=>{
 if(d.value){
  localStorage.setItem('luma',d.value);
  show(d.value,'GLOBAL - عالمي');
 }
})
.catch(()=>{
 local++;
 localStorage.setItem('luma',local);
 show(local,'OFFLINE - خدام بلا انترنت');
});
</script>
</body>
</html>
